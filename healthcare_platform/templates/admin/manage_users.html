    <script>
        function toggleUserFields() {
            const role = document.querySelector('[name="role"]').value;
            const patientFields = document.getElementById('patientFields');
            const doctorFields = document.getElementById('doctorFields');
            
            if (role === 'patient') {
                patientFields.style.display = 'block';
                doctorFields.style.display = 'none';
            } else if (role === 'doctor') {
                patientFields.style.display = 'none';
                doctorFields.style.display = 'block';
            } else {
                patientFields.style.display = 'none';
                doctorFields.style.display = 'none';
            }
        }
        
        async function addUser() {
            const form = document.getElementById('addUserForm');
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/healthcare_platform/admin/manage_users.php', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('User added successfully!', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('addUserModal')).hide();
                    setTimeout(() => location.reload(), 1500);
                } else {
                    showToast(result.data.message || 'Failed to add user', 'error');
                }
            } catch (error) {
                showToast('An error occurred', 'error');
            }
        }
        
        function editUser(userId) {
            showToast('Edit functionality - To be implemented', 'info');
        }
        
        function deleteUser(userId) {
            if (confirm('Are you sure you want to delete this user?')) {
                showToast('Delete functionality - To be implemented', 'info');
            }
        }
        
        function showToast(message, type = 'info') {
            const toast = document.getElementById('liveToast');
            const toastMessage = document.getElementById('toastMessage');
            const toastHeader = toast.querySelector('.toast-header');
            
            toastMessage.textContent = message;
            
            if (type === 'success') {
                toastHeader.classList.remove('bg-danger');
                toastHeader.classList.add('bg-success');
            } else if (type === 'error') {
                toastHeader.classList.remove('bg-success');
                toastHeader.classList.add('bg-danger');
            } else {
                toastHeader.classList.remove('bg-success', 'bg-danger');
            }
            
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            toggleUserFields();
        });
    </script>
